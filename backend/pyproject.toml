[project]
name = "backend"
version = "0.1.0"
description = "ProjectPokemon backend, Django/DRF proxy para a PokeAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.17",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.17.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

# Aplicação Django (não uma biblioteca), não é instalada como package.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "responses>=0.26.2",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]  # decoradores com chamadas (api_view) são o padrão DRF

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["pokemon"]
omit = ["*/migrations/*", "*/tests/*"]
